services:
  postgres:
    image: postgres:17
    container_name: grocery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: grocerydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d grocerydb"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  api:
    build:
      context: ./GroceryStore
      dockerfile: Dockerfile
    container_name: grocery-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASP_ENVIRONMENT}
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION}
      - JwtSettings__SecretKey=${JWT_TOKEN_KEY}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - JwtSettings__ExpirationHours=${JWT_EXPIRATION_HOURS}
      - SerilogSettings__SeqUrl=${SEQ_URL}
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
  
  seq:
    image: datalust/seq:latest
    container_name: grocery-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data

volumes:
  postgres-data:
  seq-data: